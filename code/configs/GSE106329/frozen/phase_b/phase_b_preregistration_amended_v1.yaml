preprocessing:
  primary:
    track: author_reproduction_non_deduplicated
    structure: adapter_then_remove_first_5prime_base_then_remove_barcoded_5nt_UMI_plus_4nt_barcode
    minimum_pre_linker_length_nt: 24
    contaminant_filter: documented_rRNA_tRNA_and_adapter_sequences_only
  UMI_sensitivity:
    algorithm: config/stage1b_safeguards_preregistered.yaml
    applies_to: all_barcoded_GSM
    unbarcoded_Ubc6: not_applicable
  primary_alignment:
    aligner: bowtie2
    reference: R64-1-1
    mode: end_to_end_very_sensitive
    seed_mismatches: 0
    unique_definition: MAPQ_at_least_20_primary_nonsecondary_nonsupplementary
  alignment_sensitivity:
    author_like: primary_unique_NM_equals_0

psite:
  primary_scheme: frozen/psite/psite_series_consensus_frozen.tsv
  checksum_manifest: frozen/psite/SHA256SUMS.txt
  evidence_is_TMD_blind: true
  sensitivity_schemes:
    - sample_specific
    - author_L_minus_15
    - adjacent_L_minus_16
  coding_error_exception_only: true

estimands:
  spatial_occupancy:
    definition: log2_local_Psite_density_over_gene_wide_nonTMD_CDS_background_density
    pseudocount: 0.5
  primary_discovery:
    contrast: Sec63_CHX_input_30min_minus_0min
    reason: prespecified_acute_depletion_endpoint_not_selected_from_spatial_results
  time_trajectory:
    Sec63_CHX_input: [0, 15, 30, 60]
    Ubc6_CHX_input: [0, 15, 30, 60]
    Sec63_noCHX_input: [0, 30, 60]
  proximity_difference_in_differences:
    definition: change_over_time_in_pulldown_minus_input_spatial_occupancy

coverage:
  strategy: analysis_set_and_contrast_specific
  never_use: strict_all_30_GSM
  primary_scan_population:
    required_GSM: [GSM2836139, GSM2836143]
    coordinate_unique: true
    entire_primary_window_at_each_tested_center_within_CDS: true
    minimum_callable_nonTMD_background_nt: 300
    minimum_background_Psites_each_required_GSM: 20
    minimum_local_Psites_pooled_required_GSM: 5
    exclude_all_annotated_TMDs_from_background: true
    exclude_target_scan_region_from_background: true
  validation_population:
    recompute_using_only_locked_band_and_required_Ubc6_endpoint_GSM: true
    no_reuse_of_discovery_coverage_to_force_validation: true
    interpretation: descriptive_or_supportive_only_never_formal_validation
  neighboring_TMD:
    primary: retain_and_flag
    sensitivity: exclude_windows_overlapping_another_annotated_TMD
  reporting:
    membership_table_per_contrast: required
    flow_table_per_contrast: required
    population_change_by_position: required

positional_scan:
  reference: TMD_start_nt_zero
  centers_nt: {start: -90, end: 300, step: 3}
  primary_window_width_nt: 21
  sensitivity_window_widths_nt: [15, 31]
  smoothed_curve_use: visualization_only
  statistical_counts: unsmoothed
  external_reference_positions_nt: [75]
  external_reference_not_used_for_peak_selection: true

inference:
  biological_replicates_claimed: false
  population_unit: TMD_with_gene_cluster
  gene_clustering: retain_all_TMDs_when_resampling_gene
  bootstrap:
    type: gene_cluster_nonparametric
    iterations: 10000
    random_seed: 106329
  scan_level_multiplicity:
    primary: studentized_gene_cluster_bootstrap_maxT_FWER
    alpha: 0.05
    domain: all_primary_21nt_window_centers_minus90_to_plus300
  spatial_band_definition:
    minimum_consecutive_centers: 3
    same_effect_direction: true
    simultaneous_95pct_interval_excludes_zero_at_each_center: true
    band_boundaries: maximal_contiguous_run_meeting_rule
    peak: largest_absolute_effect_within_band
    validation: summarize_Ubc6_at_discovery_locked_band_without_rescanning
    validation_interpretation: descriptive_or_supportive_only_never_formal_validation
  effect_reporting:
    unit: delta_log2_local_over_background
    report_pointwise_and_simultaneous_intervals: true
    decision_aid_absolute_effect: 0.25
    no_mechanical_threshold_cliff: true

artifact_diagnostics:
  role: prespecified_falsification_diagnostics_not_peak_selection_or_primary_inference
  never_use_to:
    - change_primary_window_or_scan_domain
    - change_Psite_or_UMI_rules
    - change_coverage_rules
    - delete_influential_genes_from_primary_analysis
    - redefine_or_reselect_the_primary_spatial_band
  within_gene_matched_pseudo_anchors:
    coordinate_grid: CDS_codons_in_primary_transcript_coordinate_system
    eligibility:
      - entire_minus90_to_plus300_scan_with_31nt_window_support_within_CDS
      - coordinate_unique
      - pseudo_anchor_not_inside_any_annotated_TMD
      - full_pseudo_anchor_scan_support_does_not_overlap_any_annotated_TMD
    matching: within_same_gene_choose_nearest_eligible_upstream_and_nearest_eligible_downstream_coordinate_to_each_true_TMD_start
    ties: choose_lower_CDS_coordinate
    replacement: false_within_each_true_TMD_match_when_possible
    no_eligible_match: report_and_exclude_from_this_diagnostic_only
    report_eligibility: [eligible_gene_count, eligible_true_TMD_count, fraction_of_primary_TMD_population, first_vs_internal_composition, single_vs_multi_pass_composition]
    minimum_interpretable_control_set: at_least_100_genes_and_at_least_25pct_of_primary_TMD_population
    insufficient_control_set: diagnostic_inconclusive_and_triggers_HOLD
    estimand: apply_identical_primary_local_over_background_contrast_and_scan_to_pseudo_anchors
    comparison_metrics: [maximum_absolute_scan_effect, longest_same_direction_run, number_of_primary_rule_spatial_bands]
    interpretation: comparable_or_stronger_pseudo_anchor_structure_triggers_HOLD_not_parameter_reselection
  within_gene_coordinate_null:
    scheme: shuffle_TMD_anchor_coordinates_within_gene_over_the_same_eligible_nonTMD_codon_pool
    preserve: [gene_membership, TMD_count_per_gene, codon_frame, primary_coverage_rules]
    assignment: without_replacement_within_gene_then_sort_assigned_coordinates_to_preserve_TMD_order
    iterations: 10000
    random_seed: 106330
    statistics: [maximum_absolute_scan_effect, longest_same_direction_run, locked_primary_band_mean_effect]
    empirical_tail: plus_one_corrected_two_sided
    no_eligible_assignment: report_gene_and_exclude_from_this_diagnostic_only
    minimum_interpretable_control_set: at_least_100_genes_and_at_least_25pct_of_primary_TMD_population
    insufficient_control_set: diagnostic_inconclusive_and_triggers_HOLD
    interpretation: observed_structure_not_more_extreme_than_coordinate_null_triggers_HOLD
  leave_one_gene_out_influence:
    timing: only_after_primary_band_is_locked_by_the_unchanged_primary_scan
    procedure: remove_one_gene_at_a_time_and_recompute_point_estimates_at_the_locked_band_and_locked_peak_without_rescanning
    summaries: [locked_band_mean_effect, locked_peak_effect, absolute_change, proportional_attenuation, direction_reversal]
    material_influence: any_direction_reversal_or_at_least_25pct_attenuation_of_locked_band_mean_effect
    interpretation: any_single_gene_material_influence_triggers_HOLD_and_review_not_gene_exclusion

targeting_integration:
  ER:
    within_series_only:
      - Sec63_CHX
      - Ubc6_CHX
      - Sec63_noCHX
    gene_level_delta: log2_pulldown_over_input_at_time_minus_log2_pulldown_over_input_at_0
  mitochondria:
    Tom20_W303: within_series_30min_minus_0min
    Om45_S288C: within_series_30min_minus_0min
    never_treat_as_replicates: true
    cross_series_summary: direction_then_random_effects_meta_analysis_if_estimands_compatible
  spatial_to_fate_model:
    outcome: gene_level_targeting_delta
    predictor: TMD_locked_band_spatial_effect
    covariates: [baseline_expression, background_coverage, annotated_TMD_count, topology, TMD_position, CHX, series]
    standard_errors: gene_clustered

TMD_features:
  evaluated_only_after_spatial_outcome_is_locked: true
  prespecified: [first_vs_internal, single_vs_multi_pass, length, hydrophobicity, aromaticity, charged_fraction, N_flank_charge, C_flank_charge]
  outcome: TMD_specific_spatial_remodeling
  circular_gene_level_targeting_feature_reanalysis_not_primary: true

decision:
  GSE106329_PROVISIONAL_GO_purpose: authorize_entry_to_independent_external_validation_not_claim_Paper3_biological_validation
  GSE106329_PROVISIONAL_GO_requires_all:
    - reproducible_downstream_spatial_band_with_scan_global_control
    - absolute_effect_approximately_at_least_0.25_with_spatial_coherence
    - noCHX_not_reversed
    - primary_effect_not_reversed_by_UMI_or_prespecified_Psite_sensitivity
    - artifact_diagnostics_do_not_show_comparable_pseudo_anchor_or_coordinate_null_structure
    - no_single_gene_has_material_leave_one_gene_out_influence
    - at_least_one_non_circular_link_to_ER_loss_mitochondrial_gain_or_prespecified_TMD_property
    - at_least_4_coverage_stable_interpretable_TMD_candidates
  GSE106329_PROVISIONAL_NO_GO_if_any:
    - no_scan_global_spatial_band
    - primary_effect_reversed_by_UMI_or_Psite_sensitivity
    - pseudo_anchor_or_coordinate_null_provides_comparable_or_stronger_structure
    - locked_band_is_materially_driven_by_one_gene
    - no_targeting_or_non_circular_feature_link
    - fewer_than_4_stable_candidates
  Ubc6_evidence:
    role: descriptive_or_supportive_only
    never_required_for_GSE106329_PROVISIONAL_GO: true
    cannot_rescue_failed_Sec63_primary_analysis: true
    formal_validation_language_prohibited: true
  PAPER3_BIOLOGICAL_GO_requires_all:
    - GSE106329_PROVISIONAL_GO
    - support_from_at_least_one_genuinely_independent_external_dataset
    - external_dataset_analysis_plan_checksum_frozen_before_viewing_its_TMD_centered_results
    - external_support_addresses_a_prespecified_independent_biological_dimension_such_as_SRP_engagement_cross_species_architecture_or_SRP_perturbation
  marginal_result_policy: NO_GO
  external_validation_before_GSE106329_PROVISIONAL_GO: prohibited
  wet_lab_constructs_before_PAPER3_BIOLOGICAL_GO: prohibited

execution_gate:
